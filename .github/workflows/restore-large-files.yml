name: Restore complete source files

on:
  push:
    branches:
      - main
    paths:
      - '.github/upload-chunks/**'
      - '.github/workflows/restore-large-files.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify source files
        shell: bash
        run: |
          cat .github/upload-chunks/workspace/*.b64 | base64 --decode > components/riftqueue-workspace.tsx
          cat .github/upload-chunks/package-lock/*.b64 | base64 --decode > package-lock.json
          test "$(git hash-object components/riftqueue-workspace.tsx)" = "f02516eb41658348fc6e199a67facf4371471f1f"
          test "$(git hash-object package-lock.json)" = "18fb8ee33968e28994d44a782527c547a2fde68c"
      - name: Commit restored files and remove staging data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .github/upload-chunks .github/workflows/restore-large-files.yml
          git add components/riftqueue-workspace.tsx package-lock.json
          git commit -m "Restore complete RiftQueue source files"
          git push
